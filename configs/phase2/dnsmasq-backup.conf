# PHASE 2 - BACKUP DNS - Mac 3 (Pratik)   (Extension A)
# Same project records as the primary on Mac 1, served from a different machine.
#   brew install dnsmasq
#   sudo cp configs/phase2/dnsmasq-backup.conf $(brew --prefix)/etc/dnsmasq.conf
#   sudo brew services start dnsmasq
#   dig @127.0.0.1 app.team1.test          # -> 10.7.11.1, TTL 30
#
# Keep the records identical to dnsmasq-primary.conf. Any record change
# (Extension B/E) must be made on BOTH DNS servers, otherwise clients get
# different answers depending on which server they ask.

no-resolv
server=8.8.8.8

local-ttl=30
host-record=app.team1.test,10.7.11.1,30
host-record=api.team1.test,10.7.11.1,30

log-queries
