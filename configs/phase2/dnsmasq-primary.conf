# PHASE 2 - PRIMARY DNS - Mac 1 (Aaryan)
# Replaces the Phase 1 lines in $(brew --prefix)/etc/dnsmasq.conf
#   sudo cp configs/phase2/dnsmasq-primary.conf $(brew --prefix)/etc/dnsmasq.conf
#   sudo brew services restart dnsmasq
#
# Changes from Phase 1:
#  - no listen-address line: dnsmasq listens on every interface, so it keeps working
#    if DHCP hands this Mac a new IP (Phase 1 hard-coded the old IP)
#  - local-ttl=30 and an explicit TTL of 30 s on each record (Extension B).
#    In Phase 1 dnsmasq used its default local TTL of 0, which means "do not cache".

no-resolv
server=8.8.8.8                 # anything that is not *.team1.test goes upstream

local-ttl=30                   # TTL (seconds) for answers dnsmasq gives from local records
host-record=app.team1.test,10.7.11.1,30     # -> Mac 2 (primary edge). Ext E changes this line.
host-record=api.team1.test,10.7.11.1,30     # -> Mac 2

log-queries                    # see each query: log stream --predicate 'process == "dnsmasq"'
