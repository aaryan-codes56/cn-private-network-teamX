# PHASE 2 - SERVICE ISOLATION (Extension C) - load on Mac 3 AND Mac 4
#
# Only the edge (nginx) may open TCP connections to the backend ports.
# Every other machine on the LAN is silently dropped (looks like a timeout).
#
# Loaded into the sub-anchor "com.apple/team1". macOS's stock /etc/pf.conf already
# evaluates every anchor under "com.apple/*", so /etc/pf.conf is NEVER edited:
#   enable  : sudo scripts/pf_enable.sh        (= pfctl -a com.apple/team1 -f this file; pfctl -E)
#   rollback: sudo scripts/pf_disable.sh       (= pfctl -a com.apple/team1 -F all; pfctl -X <token>)
#
# Extension E: the standby edge (Mac 4) must also reach Backend A on Mac 3. Add it at runtime:
#   sudo pfctl -a com.apple/team1 -t edges -T add 10.7.13.204     (run on Mac 3)

backend_ports = "{ 3001, 3002 }"

table <edges> persist { 10.7.11.1 }       # Mac 2 = primary edge

# 1. this Mac talking to itself (also covers nginx on Mac 4 -> Backend B on Mac 4)
pass in quick on lo0 all

# 2. the edge(s) may reach the backend ports
pass in quick proto tcp from <edges> to any port $backend_ports keep state

# 3. everyone else: drop SYNs to the backend ports (no RST, so the client times out)
block drop in quick proto tcp from any to any port $backend_ports

# Nothing else is touched: ping, DNS (UDP 53 on Mac 3), SSH, nginx 443 on Mac 4 all still work.
