# PHASE 2 - EDGE nginx - PRIMARY on Mac 2 (Vivek, 10.7.11.1)
#   cp configs/phase2/team1.conf $(brew --prefix)/etc/nginx/servers/team1.conf
#   sudo nginx -t && sudo brew services restart nginx
#
# The STANDBY edge on Mac 4 (Extension E) uses team1-standby.conf, which is this
# file with exactly one line changed ($edge_name).
#
# Changes from Phase 1:
#  - X-Edge header: shows WHICH edge answered (primary Mac 2 vs standby Mac 4)  -> Ext E
#  - X-Upstream / X-Upstream-Status headers: shows every backend nginx tried
#    for this request, e.g. "10.7.4.180:3001, 10.7.13.204:3002" = A failed, B served -> Ext D
#  - proxy_next_upstream also retries on 502/503/504 from a backend, max 2 tries
#  - /edge-health: answered by nginx itself (no backend), useful to separate
#    "edge is up" from "backends are up" during troubleshooting -> Ext F

upstream backends {
    # Round-robin (nginx default).
    # Passive health check: if a backend fails 3 times within 10 s it is marked
    # DOWN for 10 s; after that nginx sends it one trial request again.
    # (open-source nginx has no active health_check; that is an NGINX Plus feature)
    server 10.7.4.180:3001 max_fails=3 fail_timeout=10s;   # Mac 3 - Backend A (Pratik)
    server 10.7.13.204:3002 max_fails=3 fail_timeout=10s;   # Mac 4 - Backend B (Raghvendra)
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.team1.test api.team1.test;

    set $edge_name "mac2-primary";                # <-- the only line that differs on the standby

    # Same self-signed certificate on both edges (see ../TLS-setup.md), so clients
    # that already trust app.crt do not see a warning after the DNS cutover.
    ssl_certificate     app.crt;
    ssl_certificate_key app.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # "always" = also add the header on 4xx/5xx responses generated by nginx
    add_header X-Edge            $edge_name       always;
    add_header X-Upstream        $upstream_addr   always;
    add_header X-Upstream-Status $upstream_status always;

    location = /edge-health {
        default_type application/json;
        return 200 '{"edge":"$edge_name","status":"ok"}\n';
    }

    location / {
        proxy_pass http://backends;              # TLS terminates here; plain HTTP to backends
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;               # flaky college Wi-Fi (see Phase 1 notes)
        proxy_read_timeout    15s;

        # Failover: on a failed connection / timeout / 5xx, try the OTHER backend.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
