# Mac 2 (Vivek, 10.7.11.1) - /opt/homebrew/etc/nginx/servers/team1.conf
# Test + start:  sudo nginx -t && sudo brew services start nginx

upstream backends {
    # Round-robin (nginx default): requests alternate A, B, A, B
    # max_fails/fail_timeout: after 3 failed attempts a backend is skipped for 5 s.
    # (Raised from max_fails=1 because the college Wi-Fi occasionally drops a connection.)
    server 10.7.6.153:3001 max_fails=3 fail_timeout=5s;   # Mac 3 - Backend A (Pratik)
    server 10.7.2.250:3002 max_fails=3 fail_timeout=5s;   # Mac 4 - Backend B (Raghvendra)
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.team1.test api.team1.test;

    # Self-signed certificate created with OpenSSL (see TLS-setup.md)
    ssl_certificate     app.crt;
    ssl_certificate_key app.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://backends;              # TLS terminates here; plain HTTP to backends
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_next_upstream error timeout;       # retry the other backend on failure
    }
}
